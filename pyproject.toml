[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "AETHER: electric propulsion modelling, pre-sizing and hardware validation. Sibling to GAIA."
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["aether*"]
